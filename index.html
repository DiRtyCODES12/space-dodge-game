<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightfall Keep</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ARCANE DEFENSE // SECTOR 07</p>
          <h1>Nightfall Keep</h1>
        </div>
        <div class="hud">
          <div class="stat"><span>Wave</span><strong id="waveCount">1</strong></div>
          <div class="stat"><span>Gold</span><strong id="goldCount">120</strong></div>
          <div class="stat"><span>Keep HP</span><strong id="hpCount">100</strong></div>
        </div>
      </header>

      <main class="game-layout">
        <section class="arena-panel">
          <canvas id="gameCanvas" width="960" height="620" aria-label="Nightfall Keep game"></canvas>
        </section>

        <aside class="sidebar">
          <div class="panel-block">
            <div class="panel-label"><span class="dot"></span> Command Deck</div>
            <p class="subtitle">Select a tower and click a glowing build site.</p>
          </div>

          <div class="tower-picker">
            <button class="tower-button active" data-tower="scout">
              <span class="name">Scout Archer</span>
              <span class="meta">50 Gold</span>
            </button>
            <button class="tower-button" data-tower="frost">
              <span class="name">Frost Archer</span>
              <span class="meta">80 Gold</span>
            </button>
            <button class="tower-button" data-tower="nova">
              <span class="name">Nova Archer</span>
              <span class="meta">120 Gold</span>
            </button>
          </div>

          <button id="startWave" class="action primary">Start Wave</button>

          <button id="abilityVolley" class="action ability-btn" data-ability="volley">
            <span>Volley</span>
            <small>40 Gold • Q</small>
          </button>

          <button id="abilityFreeze" class="action ability-btn" data-ability="freeze">
            <span>Frost Nova</span>
            <small>35 Gold • E</small>
          </button>

          <div class="legend">
            <div><i class="legend-green"></i> Scout</div>
            <div><i class="legend-blue"></i> Frost</div>
            <div><i class="legend-orange"></i> Nova</div>
            <div><i class="legend-red"></i> Zombie</div>
          </div>

          <div id="messageBox" class="message-box">Choose your tower and prepare the keep.</div>
        </aside>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
